name: curt_network_bridge
from_domain: 0 # Internal RouDi domain
to_domain: 133  # External multi-robot domain

topics:
  /imu/data:
    type: sensor_msgs/msg/Imu
    remap: /curt/imu/data

  /ouster/imu:
    type: sensor_msgs/msg/Imu
    remap: /curt/ouster/imu

  /ouster/points_filtered:
    type: sensor_msgs/msg/PointCloud2
    remap: /curt/ouster/points_filtered
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10

  /initial_map_filtered:
    type: sensor_msgs/msg/PointCloud2
    remap: /curt/initial_map
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10

  /tf_static:
    type: tf2_msgs/msg/TFMessage
    remap: /tf_static

  /tf:
    type: tf2_msgs/msg/TFMessage
    remap: /tf

  /robot_description:
    type: std_msgs/msg/String
    remap: /curt/robot_description

  /occupancy_map_local:
    type: nav_msgs/msg/OccupancyGrid
    remap: /curt/occupancy_map_local

  /global_costmap/costmap:
    type: nav_msgs/msg/OccupancyGrid
    remap: /curt/global_costmap/costmap
  
  /optimal_trajectory:
    type: nav_msgs/msg/Path
    remap: /curt/optimal_trajectory

  /global_path:
    type: nav_msgs/msg/Path
    remap: /curt/global_path
  
  /curt/goal_pose:
    type: geometry_msgs/msg/PoseStamped
    remap: /goal_pose
    from_domain: 133
    to_domain: 0

  /curt/prm_goal:
    type: geometry_msgs/msg/PoseStamped
    remap: /prm_goal
    from_domain: 133
    to_domain: 0

  # NAV2 + TM
  
  /occupancy_map_local:
    type: nav_msgs/msg/OccupancyGrid
    remap: /curt/occupancy_map_local

  /global_costmap/costmap:
    type: nav_msgs/msg/OccupancyGrid
    remap: /curt/global_costmap/costmap
  
  /optimal_trajectory:
    type: nav_msgs/msg/Path
    remap: /curt/optimal_trajectory

  # SCOVOX

  /dscovox_node/pointcloud:
    type: sensor_msgs/msg/PointCloud2
    remap: /curt/dscovox_node/pointcloud

  /scovox_node/pointcloud:
    type: sensor_msgs/msg/PointCloud2
    remap: /curt/scovox_node/pointcloud

  /explo_planner/candidates:
    type: visualization_msgs/msg/MarkerArray
    remap: /curt/explo_planner/candidates
  

  # Reverse direction: Allow external /robot_1/cmd_vel -> internal /cmd_vel
  # /curt/imu/data:
  #   type: sensor_msgs/msg/Imu
  #   from_domain: 133
  #   to_domain: 0