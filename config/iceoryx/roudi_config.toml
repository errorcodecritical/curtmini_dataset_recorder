# iceoryx RouDi config
#
# One RouDi instance per robot (host), shared by every driver container via
# `ipc: host` + the shared /dev/shm mount in docker-compose.yml.
#
# Mempool sizing rule of thumb: each pool needs (payload size + ~128B header),
# rounded up, with enough `count` for your worst-case in-flight sample count
# across every publisher/subscriber pair using that size class.
#
# *** ROBOT-SPECIFIC: retune against your actual message sizes ***
# - Hesai point clouds and OAK-D frames are the largest payloads here; check
#   real serialized size with `ros2 topic bw <topic>` / `ros2 topic hz` and
#   adjust the 1 MiB / 8 MiB pools below if they're bigger (e.g. high-res
#   RGB or multiple point cloud fields pushes well past 8 MiB).
# - If RouDi logs "no more chunks available" for a topic, bump that pool's
#   `count` (or size) rather than the others.

[general]
version = 1

[[segment]]
  # Tier 1: Small control/telemetry (IMU, Odometry, TF, JointStates)
  [[segment.mempool]]
  size = 4096
  count = 10000

  # Tier 2: Compressed images, 2D laserscans, status diagnostics
  [[segment.mempool]]
  size = 262144        # 256 KiB
  count = 5000

  # Tier 3: Medium point clouds, HD compressed video
  [[segment.mempool]]
  size = 4194304       # 4 MiB
  count = 1000

  # Tier 4: Standard point clouds (Hesai/Velodyne/OAK-D depth)
  [[segment.mempool]]
  size = 16777216      # 16 MiB
  count = 300

  # Tier 5: dense fused point clouds (scovox / dscovox merged grids).
  # Headroom only -- no curt sensor reaches 64 MiB: the worst raw payloads are
  # the Ouster OS-128 cloud at ~6 MiB and the RealSense depth cloud at ~4.7 MiB,
  # both of which land in Tier 4. Count is deliberately low; raise it only if
  # RouDi logs "no more chunks available" for this size class.
  [[segment.mempool]]
  size = 67108864      # 64 MiB
  count = 30
