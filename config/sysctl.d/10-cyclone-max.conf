# Increase the maximum receive/send buffer sizes to allow large bursts
net.core.rmem_max=2147483647
net.core.wmem_max=2147483647
net.core.rmem_default=26214400
net.core.wmem_default=26214400

# Optimize memory thresholds for high-volume IP packet fragmentation
net.ipv4.ipfrag_time=3
net.ipv4.ipfrag_high_thresh=134217728
net.ipv4.ipfrag_low_thresh=100663296

# Add this file to /etc/sysctl.d/ and apply with sudo sysctl -p --system